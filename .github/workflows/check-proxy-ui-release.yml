name: Proxy UI release consistency

on:
  pull_request:
    paths:
      - 'litellm-proxy-extras/**'
      - 'pyproject.toml'
      - 'ui/litellm-dashboard/**'
      - 'scripts/check_proxy_ui_release.py'
      - '.github/workflows/check-proxy-ui-release.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check asset version and dependency pin
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_proxy_ui_release.py --base "$BASE_SHA"
      - uses: ./.github/actions/setup-uv-with-retries
        with:
          version: '0.10.9'
      - name: Verify built dashboard assets
        run: |
          uv build --package litellm-proxy-extras --wheel --out-dir dist/ui-check
          python scripts/check_proxy_ui_release.py --extras-wheel dist/ui-check/litellm_proxy_extras-*.whl
